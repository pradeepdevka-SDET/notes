name : CI

on:
  push :
    branches: [main]
  pull_requests:

  jobs:
    build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: Check out code
          uses: actions/checkout@4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.26'
          
        - name: Vet
          run: go vet ./...
        
        - name: Build
          run: go build ./...

        - name: Test
          run: go test ./...
